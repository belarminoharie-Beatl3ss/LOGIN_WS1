<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="logstyle.css"/>
</head>




<body>
    <div class="container">
      <form class="forms">
        
        <div>
          <img src="https://img.magnific.com/free-vector/blue-circle-with-white-user_78370-4707.jpg?semt=ais_hybrid&w=740&q=80" alt="Profile" class="profile"/>
          <h1>Login</h1>
          <h4>Please log in</h4>
        </div>

        <div>
          <input type="text" name="username" id="username" placeholder="Username" required/>
          
          <input type="password" name="password" id="password" placeholder="Password" required>
          
          <p>Don't have an account? <a href="register.html">Create account</a></p>

          
          <button type="submit">Login</button>
        </div>
        
      </form>
    </div>
</body>

</html>
